<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        header { border-bottom: 1px solid #eee; margin-bottom: 2rem; }
        footer { margin-top: 3rem; border-top: 1px solid #eee; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <header><h1>{{ .Site.Title }}</h1></header>
    <main>{{ .Content }}</main>
    <footer>&copy; {{ now.Format "2006" }} {{ .Site.Title }}</footer>
</body>
</html>
